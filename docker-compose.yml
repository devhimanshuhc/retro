services:
  redis:
    image: redis:7
    # BullMQ requires noeviction: an evicted key is a lost job
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ["6380:6379"]  # 6379 on the host is taken by a Homebrew redis
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  # Nango (self-hosted): OAuth + proxy for connectors such as Google Docs. Start with:
  #   docker compose --profile nango up -d
  # Dashboard and API on :3003, Connect UI on :3009. Secrets come from the root .env (see .env.example).
  nango-db:
    profiles: [nango]
    image: postgres:16.0-alpine
    environment:
      POSTGRES_USER: nango
      POSTGRES_PASSWORD: nango
      POSTGRES_DB: nango
    ports: ["5433:5432"]  # 5432 left free for any local postgres
    volumes: [nangodata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nango"]
      interval: 5s
      retries: 10

  nango-redis:
    profiles: [nango]
    image: redis:7.2.4  # no host port: 6379 is the Homebrew redis, 6380 is Retro's

  nango-server:
    profiles: [nango]
    image: nangohq/nango-server:hosted
    platform: linux/amd64  # no arm64 image yet: runs under emulation on Apple Silicon
    depends_on:
      nango-db: {condition: service_healthy}
      nango-redis: {condition: service_started}
    environment:
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:?set NANGO_ENCRYPTION_KEY in the root .env}
      NANGO_DB_HOST: nango-db
      NANGO_DB_USER: nango
      NANGO_DB_PASSWORD: nango
      NANGO_DB_NAME: nango
      RECORDS_DATABASE_URL: postgresql://nango:nango@nango-db:5432/nango
      NANGO_REDIS_URL: redis://nango-redis:6379
      SERVER_PORT: 3003
      NANGO_SERVER_URL: http://localhost:3003
      NANGO_PUBLIC_SERVER_URL: http://localhost:3003
      FLAG_SERVE_CONNECT_UI: "true"
      NANGO_PUBLIC_CONNECT_URL: http://localhost:3009
      FLAG_AUTH_ENABLED: "false"
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME:?set in the root .env}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD:?set in the root .env}
      CSP_REPORT_ONLY: "true"
      LOG_LEVEL: info
    ports: ["3003:3003", "3009:3009"]
    restart: unless-stopped

volumes:
  redisdata:
  mongodata:
  nangodata:
