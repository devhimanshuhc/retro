services:
  redis:
    image: redis:7
    # BullMQ requires noeviction: an evicted key is a lost job
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ["6380:6379"]  # 6379 on the host is taken by a Homebrew redis
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

volumes:
  redisdata:
  mongodata:
